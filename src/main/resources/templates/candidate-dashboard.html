<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/jobs"><i class="fas fa-list"></i> Jobs</a></li>
            <li class="nav-item"><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button></form></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2><i class="fas fa-user-graduate text-info"></i> Candidate Dashboard</h2>
    <p class="text-muted">Find jobs and track your applications.</p>
    <hr>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="card text-white bg-info"><div class="card-body"><h5><i class="fas fa-paper-plane"></i> Applied</h5><p class="display-6">5</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-warning"><div class="card-body"><h5><i class="fas fa-clock"></i> Review</h5><p class="display-6">2</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-success"><div class="card-body"><h5><i class="fas fa-check-circle"></i> Interviews</h5><p class="display-6">3</p></div></div></div>
    </div>

    <!-- القائمة الرئيسية (تم تعديل الروابط هنا) -->
    <div class="mt-4 list-group shadow-sm">
        <a href="/jobs" class="list-group-item list-group-item-action"><i class="fas fa-search text-primary"></i> Browse Available Jobs</a>
        <!-- ✅ تم التعديل: بيروح على صفحة رفع الـ CV -->
        <a href="/candidate/profile" class="list-group-item list-group-item-action"><i class="fas fa-upload text-success"></i> Upload CV</a>
        <!-- ✅ تم التعديل: بيروح على صفحة طلباتي -->
        <a href="/candidate/applications" class="list-group-item list-group-item-action"><i class="fas fa-eye text-warning"></i> Track Application Status</a>
    </div>
</div>

</body>
</html>
