<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3><i class="fas fa-user-circle text-primary"></i> My Profile</h3>
        <hr>

        <!-- عرض رسائل النجاح أو الخطأ -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row">
            <div class="col-md-6">
                <p><strong>Name:</strong> <span th:text="${candidate.fullName}"></span></p>
                <p><strong>Email:</strong> <span th:text="${candidate.email}"></span></p>
                <p><strong>Phone:</strong> <span th:text="${candidate.phone}"></span></p>
                <p><strong>Location:</strong> <span th:text="${candidate.location}"></span></p>
                <p><strong>Tags:</strong> <span class="badge bg-info" th:text="${candidate.tags}"></span></p>
            </div>
            <div class="col-md-6">
                <div class="card bg-light p-3">
                    <h5><i class="fas fa-file-upload text-success"></i> Upload CV</h5>
                    <form th:action="@{/candidate/profile/upload}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="file" name="cvFile" class="form-control" accept=".pdf,.doc,.docx" required>
                        </div>
                        <button type="submit" class="btn btn-success"><i class="fas fa-upload"></i> Upload</button>
                    </form>
                    <p class="mt-2 small text-muted">Allowed: PDF, DOC, DOCX</p>
                    <p th:if="${candidate.cvFileName}" class="mt-2">
                        <i class="fas fa-file-pdf text-danger"></i> Current CV: <span th:text="${candidate.cvFileName}"></span>
                    </p>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
