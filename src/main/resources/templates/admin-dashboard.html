<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/users"><i class="fas fa-users-cog"></i> Users</a></li>
            <li class="nav-item"><a class="nav-link" href="/jobs"><i class="fas fa-list"></i> Jobs</a></li>
            <li class="nav-item"><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button></form></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <h2><i class="fas fa-shield-alt text-danger"></i> Admin Dashboard</h2>
    <p class="text-muted">Full control over the recruitment platform.</p>
    <hr>
    <div class="row g-4">
        <div class="col-md-3"><div class="card text-white bg-primary"><div class="card-body"><h5><i class="fas fa-users"></i> Users</h5><p class="display-6">24</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-success"><div class="card-body"><h5><i class="fas fa-briefcase"></i> Jobs</h5><p class="display-6">15</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-warning"><div class="card-body"><h5><i class="fas fa-file-alt"></i> Applications</h5><p class="display-6">42</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-danger"><div class="card-body"><h5><i class="fas fa-user-tie"></i> Interviewers</h5><p class="display-6">7</p></div></div></div>
    </div>
    <div class="mt-4 list-group shadow-sm">
        <a href="/admin/users" class="list-group-item list-group-item-action"><i class="fas fa-user-plus text-primary"></i> Manage Users & Roles</a>
        <a href="/jobs" class="list-group-item list-group-item-action"><i class="fas fa-edit text-success"></i> Manage Jobs</a>
        <a href="/api/admin/applications" class="list-group-item list-group-item-action"><i class="fas fa-chart-line text-warning"></i> View Statistics</a>
    </div>
</div>
</body>
</html>
