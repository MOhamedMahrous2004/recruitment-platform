<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/jobs"><i class="fas fa-list"></i> Jobs</a></li>
                <li class="nav-item"><span class="badge bg-light text-dark mt-2" th:text="'Role: ' + ${role}"></span></li>
                <li class="nav-item ms-2"><form th:action="@{/logout}" method="post" class="d-inline"><button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button></form></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-briefcase text-primary"></i> Available Jobs</h2>
        <div>
            <a href="/dashboard" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <a th:if="${role == 'ADMIN' or role == 'HR'}" href="/jobs/create" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> Create Job</a>
        </div>
    </div>
    <div th:if="${jobs.isEmpty()}" class="alert alert-info"><i class="fas fa-info-circle"></i> No jobs available yet. Check back later.</div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="job : ${jobs}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${job.title}">Job Title</h5>
                    <p class="card-text text-muted small" th:text="${job.description}">Description</p>
                    <ul class="list-unstyled">
                        <li><i class="fas fa-map-marker-alt text-danger"></i> <span th:text="${job.location}">Location</span></li>
                        <li><i class="fas fa-clock text-info"></i> <span th:text="${job.employmentType}">Type</span></li>
                        <li><i class="fas fa-dollar-sign text-success"></i> <span th:text="${job.salary}">Salary</span></li>
                        <li><i class="fas fa-tags text-warning"></i> <span th:text="${job.skills}">Skills</span></li>
                    </ul>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between align-items-center">
                    <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> Details</a>
                    <span th:if="${role == 'ADMIN' or role == 'HR'}" class="btn-group">
                        <a th:href="@{/jobs/{id}/edit(id=${job.id})}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
