<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${job.title}">Job Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment</a>
    <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/jobs"><i class="fas fa-list"></i> Jobs</a></li></ul></div></nav>
<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h2 th:text="${job.title}">Title</h2>
        <hr>
        <p><strong>Description:</strong><br><span th:text="${job.description}"></span></p>
        <div class="row mt-3">
            <div class="col-md-6"><i class="fas fa-map-marker-alt text-danger"></i> <strong>Location:</strong> <span th:text="${job.location}"></span></div>
            <div class="col-md-6"><i class="fas fa-clock text-info"></i> <strong>Type:</strong> <span th:text="${job.employmentType}"></span></div>
            <div class="col-md-6"><i class="fas fa-tags text-warning"></i> <strong>Skills:</strong> <span th:text="${job.skills}"></span></div>
            <div class="col-md-6"><i class="fas fa-dollar-sign text-success"></i> <strong>Salary:</strong> <span th:text="${job.salary}"></span></div>
        </div>
        <div class="mt-3">
            <div th:if="${role == 'ADMIN' or role == 'HR'}">
                <a th:href="@{/jobs/{id}/edit(id=${job.id})}" class="btn btn-warning"><i class="fas fa-edit"></i> Edit</a>
                <form th:action="@{/jobs/{id}/delete(id=${job.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete?');">
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
