<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment</a>
    <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li></ul></div></nav>
<div class="container mt-4">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:700px;">
        <h2><i class="fas fa-edit text-warning"></i> Edit Job</h2>
        <form th:action="@{/jobs/{id}/edit(id=${job.id})}" th:object="${job}" method="post">
            <div class="mb-3"><label class="form-label">Title</label><input type="text" th:field="*{title}" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea th:field="*{description}" rows="4" class="form-control" required></textarea></div>
            <div class="row"><div class="col-md-6 mb-3"><label>Location</label><input type="text" th:field="*{location}" class="form-control" required></div>
                <div class="col-md-6 mb-3"><label>Employment Type</label>
                    <select th:field="*{employmentType}" class="form-select"><option value="FULL_TIME">Full Time</option><option value="PART_TIME">Part Time</option><option value="REMOTE">Remote</option><option value="HYBRID">Hybrid</option><option value="CONTRACT">Contract</option></select>
                </div></div>
            <div class="row"><div class="col-md-6 mb-3"><label>Skills</label><input type="text" th:field="*{skills}" class="form-control" required></div>
                <div class="col-md-6 mb-3"><label>Salary</label><input type="text" th:field="*{salary}" class="form-control" required></div></div>
            <button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Update Job</button>
            <a href="/jobs" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
