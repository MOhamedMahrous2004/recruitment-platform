<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .register-card { max-width: 480px; margin: 60px auto; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-3x text-success"></i>
            <h1 class="mt-2">Create Account</h1>
            <p class="text-muted">Start your career journey</p>
        </div>

        <div th:if="${error}">
            <div class="alert alert-danger" th:text="${error}">Error</div>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100"><i class="fas fa-user-check"></i> Create Candidate Account</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none">Already have an account? Login</a><br>
            <a href="/" class="text-decoration-none small">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
