<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .login-card { max-width: 420px; margin: 80px auto; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .login-card h1 { font-weight: 700; color: #1e3c72; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-briefcase fa-3x text-primary"></i>
            <h1 class="mt-2">Welcome Back</h1>
            <p class="text-muted">Login to your account</p>
        </div>

        <div th:if="${param.error}">
            <div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Invalid email or password.</div>
        </div>
        <div th:if="${param.logout}">
            <div class="alert alert-success"><i class="fas fa-check-circle"></i> You have been logged out.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="username" class="form-control" placeholder="admin@recruitment.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="/register" class="text-decoration-none">Create a new account</a><br>
            <a href="/" class="text-decoration-none small">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
