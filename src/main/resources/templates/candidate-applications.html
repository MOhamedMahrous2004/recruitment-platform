<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3><i class="fas fa-paper-plane text-primary"></i> My Applications</h3>
        <hr>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Status</th>
                    <th>Applied At</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.job.title}">Job Title</td>
                    <td>
                        <span th:if="${app.status == 'APPLIED'}" class="badge bg-primary">Applied</span>
                        <span th:if="${app.status == 'INTERVIEW'}" class="badge bg-warning text-dark">Interview</span>
                        <span th:if="${app.status == 'OFFER'}" class="badge bg-success">Offer</span>
                        <span th:if="${app.status == 'DISQUALIFIED'}" class="badge bg-danger">Disqualified</span>
                    </td>
                    <td th:text="${app.appliedAt}">Date</td>
                    <td>
                        <a th:href="@{/jobs/{id}(id=${app.job.id})}" class="btn btn-sm btn-primary">View Job</a>
                    </td>
                </tr>
                <tr th:if="${applications.isEmpty()}">
                    <td colspan="4" class="text-center text-muted">You haven't applied to any jobs yet.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
