<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Recruitment Platform</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/jobs"><i class="fas fa-list"></i> Jobs</a></li>
            <li class="nav-item"><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button></form></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <h2><i class="fas fa-user-tie text-primary"></i> HR Dashboard</h2>
    <p class="text-muted">Manage the recruitment process.</p>
    <hr>
    <div class="row g-4">
        <div class="col-md-3"><div class="card text-white bg-primary"><div class="card-body"><h5><i class="fas fa-briefcase"></i> Jobs</h5><p class="display-6">12</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-success"><div class="card-body"><h5><i class="fas fa-file-alt"></i> Applications</h5><p class="display-6">34</p></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-warning"><div class="card-body"><h5><i class="fas fa-user-clock"></i> Review</h5><p class="display-6">6</p></div></div></div>
    </div>
    <div class="mt-4 list-group shadow-sm">
        <a href="/jobs/create" class="list-group-item list-group-item-action"><i class="fas fa-plus-circle text-success"></i> Create New Job</a>
        <a href="/api/hr/candidates" class="list-group-item list-group-item-action"><i class="fas fa-users text-primary"></i> Review Candidates</a>
        <a href="/api/hr/applications" class="list-group-item list-group-item-action"><i class="fas fa-calendar-check text-info"></i> Manage Applications</a>
    </div>
</div>
</body>
</html>
