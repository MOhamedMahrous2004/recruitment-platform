<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-briefcase"></i> Admin Panel</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button></form></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <h2><i class="fas fa-users-cog text-primary"></i> Manage Users</h2>
    <div th:if="${success}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

    <div class="card shadow-sm p-4 mb-4">
        <h4><i class="fas fa-user-plus"></i> Create New User</h4>
        <form th:action="@{/admin/users/create}" th:object="${user}" method="post" class="row g-3 mt-2">
            <div class="col-md-6"><label class="form-label">Name</label><input type="text" th:field="*{name}" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" th:field="*{email}" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Password</label><input type="password" th:field="*{password}" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Role</label>
                <select th:field="*{role}" class="form-select" required>
                    <option value="">Select Role</option>
                    <option value="ADMIN">ADMIN</option><option value="HR">HR</option>
                    <option value="INTERVIEWER">INTERVIEWER</option><option value="CANDIDATE">CANDIDATE</option>
                </select>
            </div>
            <div class="col-12"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create User</button></div>
        </form>
    </div>
    <div class="card shadow-sm p-3"><h5>Role Descriptions</h5><ul><li><strong>ADMIN</strong> - Full access</li><li><strong>HR</strong> - Recruitment</li><li><strong>INTERVIEWER</strong> - Evaluations</li><li><strong>CANDIDATE</strong> - Applications</li></ul></div>
</div>
</body>
</html>
