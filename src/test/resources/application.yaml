spring:
  datasource:
    url: jdbc:mysql://localhost:3306/recruitment_db
    username: root
    password: Mm#22512599
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  ldap:
    embedded:
      base-dn:
        - dc=example,dc=com
      port: 8489
      ldif: classpath:schema.ldif
      validation:
        enabled: true

server:
  port: 8081

app:
  ldap:
    enabled: true
    user-search-base: ou=people
    user-search-filter: (uid={0})

  security:
    admin-email: admin@recruitment.com
    admin-password: Admin@123
    ldap-email: ldapuser@recruitment.com
    ldap-username: ldapuser
    ldap-password: Ldap@123

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-default-pretty-printer: true